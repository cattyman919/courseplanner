[project]
name = "courseplanner"
version = "0.1.0"
description = "Symbolic AI course planner demo (Streamlit + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]
