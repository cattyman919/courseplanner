[project]
name = "courseplanner"
version = "0.1.0"
description = "Symbolic AI course planner demo (FastAPI + HTML/JS + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]
