<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoursePath · Symbolic course planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <circle cx="6" cy="16" r="3" fill="currentColor"/>
          <circle cx="16" cy="8" r="3" fill="currentColor"/>
          <circle cx="16" cy="24" r="3" fill="currentColor"/>
          <circle cx="26" cy="16" r="3" fill="currentColor"/>
          <path d="M8.5 14.5 L13.5 9.5 M8.5 17.5 L13.5 22.5 M18.5 9.5 L23.5 14.5 M18.5 22.5 L23.5 17.5"
                fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">CoursePath</div>
        <div class="brand-tag">rules · constraints · BFS / UCS / A*</div>
      </div>
    </div>
    <nav class="steps" id="nav" aria-label="Views"></nav>
  </header>

  <main class="app-main" id="main">
    <div class="loading" id="loading">Loading the knowledge base…</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- Persistent live region: views announce results here because their own DOM is redrawn. -->
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
